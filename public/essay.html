<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 文书助手</title><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/essay.css"></head>
<body><a class="skip-link" href="#main">跳到主要内容</a><header class="site-header" id="siteHeader"></header><main id="main" class="container page-main"><header class="page-heading"><p class="eyebrow">YOUR STORY, YOUR VOICE</p><h1>AI 文书助手</h1><p class="lead">先诊断，再修改。<br>帮助你把自己的故事讲得更清楚。</p></header><div class="essay-layout"><form class="card essay-form" id="essayForm"><div class="field-row"><div class="field"><label for="essaySchool">目标学校</label><select id="essaySchool" required><option value="">请选择目标学校</option></select></div><div class="field"><label for="essayType">文书类型</label><select id="essayType"><option>Personal Statement</option><option>Common App Essay</option><option>Supplemental Essay</option><option>Why School</option><option>Other</option></select></div></div><div class="field" id="otherSchoolField" hidden><label for="otherSchool">学校名称</label><input id="otherSchool" maxlength="120" placeholder="请输入目标学校"></div><div class="field"><label for="essayPrompt">文书题目 / Prompt <span class="muted">（可选）</span></label><textarea id="essayPrompt" rows="3" maxlength="3000" placeholder="粘贴你收到的文书题目，便于检查题目匹配度。"></textarea></div><div class="field"><label for="essayText">你的文书</label><textarea id="essayText" rows="12" maxlength="12000" required placeholder="把你自己创作的文书放在这里。从一个真实故事开始。"></textarea><p id="wordCount" class="word-count" aria-live="polite">0 / 12000 字符 · 0 个空格分词</p></div><p id="essayStatus" class="notice error" role="alert" hidden></p><button class="button essay-submit" id="analyzeButton" type="submit">AI 分析文书</button><p class="privacy-note">点击分析将把文书、题目和目标学校发送给 Kimi 处理。本应用不长期保存文章、不写入本地存储；服务商的数据处理规则适用。建议移除姓名、联系方式等不必要的个人信息。</p></form><div id="essayResults" class="essay-results" aria-live="polite"><div class="empty-state"><span class="empty-mark" aria-hidden="true">✎</span><h2>好的表达，从看懂自己开始。</h2><p>把你的文书放进来，<br>我们先看看哪里最值得改。</p></div></div></div></main><footer class="site-footer" id="siteFooter"></footer><div id="toast" class="toast" role="status" hidden></div><script type="module" src="/js/essay.js"></script></body></html>
